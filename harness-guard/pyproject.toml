[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-guard"
version = "0.1.0"
description = "Agent harness bypass security tester — CoreBreak vulnerability class"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13",
    "cryptography>=42",
    "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
harness-guard = "harness_guard.cli:main"

[tool.setuptools.packages.find]
include = ["harness_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
