[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honesty-gate"
version = "0.1.0"
description = "CI-native coverage-honesty gate for code-review agents: proves what a review agent actually opened vs. what it claimed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ProtoGensis" }]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
llm = ["litellm>=1.60,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
honesty-gate = "honesty_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"honesty_gate.harness" = ["registry.yaml", "fixtures/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
