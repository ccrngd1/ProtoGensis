name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,local]"

    - name: Download spaCy model
      run: python -m spacy download en_core_web_sm

    - name: Lint with ruff
      run: ruff check coherenceprobe/ tests/

    - name: Format check with black
      run: black --check coherenceprobe/ tests/

    - name: Type check with mypy
      run: mypy coherenceprobe/ --ignore-missing-imports
      continue-on-error: true  # Don't fail on type errors (optional)

    - name: Run tests
      run: pytest tests/ -v --cov=coherenceprobe --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-local-mode:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,local]"

    - name: Download spaCy model
      run: python -m spacy download en_core_web_sm

    - name: Test local mode (no API calls)
      run: pytest tests/ -v -k "local" --cov=coherenceprobe

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check README
      run: |
        python -c "import pathlib; readme = pathlib.Path('README.md').read_text(); assert len(readme) > 100, 'README too short'"

    - name: Validate markdown
      uses: DavidAnson/markdownlint-cli2-action@v11
      with:
        globs: '*.md'
      continue-on-error: true
