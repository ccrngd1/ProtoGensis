[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coherenceprobe"
version = "0.1.0"
description = "Detect logical contradictions across multi-agent AI pipeline outputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CoherenceProbe Contributors"}
]
keywords = ["ai", "testing", "multi-agent", "contradiction-detection", "llm", "nli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "litellm>=1.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tf-keras>=2.15.0",  # Backwards-compatible Keras for transformers
]

[project.optional-dependencies]
local = [
    "spacy>=3.7.0",
]
viz = [
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
coherenceprobe = "coherenceprobe.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/coherenceprobe"
Documentation = "https://github.com/yourusername/coherenceprobe#readme"
Repository = "https://github.com/yourusername/coherenceprobe"
Issues = "https://github.com/yourusername/coherenceprobe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["coherenceprobe*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
