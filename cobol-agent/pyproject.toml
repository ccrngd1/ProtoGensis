[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt"
version = "0.1.0"
description = "AI-powered COBOL comprehension and translation CLI: explain, translate to Java, generate characterization tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ProtoGensis" }]
keywords = ["cobol", "mainframe", "modernization", "translation", "llm", "copybook", "comp-3"]
dependencies = [
    "click>=8.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cobalt = "cobalt.cli:main"

[tool.setuptools.packages.find]
include = ["cobalt*"]

# Sample COBOL assets and the parser JAR live in ./assets at the package root;
# paths are resolved relative to the source tree, which works under the
# supported editable (pip install -e .) install.

[tool.pytest.ini_options]
testpaths = ["tests"]
