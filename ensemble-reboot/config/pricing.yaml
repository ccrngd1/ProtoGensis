# Pricing for the ensemble-reboot roster, USD per 1M tokens, GLOBAL cross-region
# inference (matches the `global.` profile ids we call).
#
# Primary source: AWS Price List API (no credentials), retrieved 2026-10-22:
#   - https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/index.json
#     (Grok 4.7, Kimi K3, Nova 2.0 Lite; usagetypes like
#      USE1-xai.grok-4.7-mantle-input-tokens-global-standard, unit 1K tokens)
#   - https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
#     (Anthropic Fable 5.1 / Opus 5.5 / Sonnet 5.5 / Haiku 5.5, OpenAI GPT-6 Astra;
#      usagetypes like USE1-MP:USE1_input_tokens_global_standard-Units, unit 1M tokens)
# Fallback source (models not yet in the Price List API as of 2026-10-22):
#   - GPT-6.1 Sol: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-1-sol.html
#   - GPT-6 Luna:  https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-luna.html
#     (both pages list "Global CRIS (bedrock-runtime)" rows; short-context rates,
#      which apply to all our requests: inputs are far below 272K tokens)
#
# Global-vs-regional premium: in-Region / US-CRIS rates are 10% ABOVE Global CRIS
# for every roster model that lists both (e.g. Fable 5.1: $11 vs $10 input;
# Grok 4.7: $2.20 vs $2.00). We pay the global rate.
#
# status: OK = price verified from the listed source on retrieved_date.
#         UNKNOWN = not found; cost code must propagate UNKNOWN, never treat as $0.

retrieved_date: "2026-10-22"
currency: USD
unit: per_1M_tokens
inference_tier: global_cris_standard

